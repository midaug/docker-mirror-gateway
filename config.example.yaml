# Docker Mirror Gateway 配置文件
# 所有字段都可用环境变量覆盖（如 MIRROR_GATEWAY_ADDR），也支持 ${ENV_VAR} 占位符。
# 完整字段说明见 docs/configuration.md。

data:
  dir: "./data"                 # 统一数据目录；Docker 挂载这一个目录即可
  persist: false                # 拉取记录是否落盘（服务器/Docker 建议 true）

server:
  addr: ":8080"                 # 镜像拉取端口（/v2/*）
  adminAddr: ":8081"            # 管理端口；留空则与 addr 合并，生产建议只绑内网
  publicURL: ""                 # 对外访问地址，反代/域名时填，如 https://mirror.example.com
  adminToken: ""                # 管理接口令牌；留空不校验，建议仅内网使用
  readHeaderTimeout: 10s
  idleTimeout: 120s
  maxManifestBytes: 8388608     # manifest 大小上限（8MB）

cache:
  enabled: false                # 默认关闭；多机共享或省回源带宽时再开
  backend: disk                 # disk 或 s3
  dir: ""                       # 留空则用 data.dir/cache；显式填写时优先
  maxSizeGB: 50                 # 容量上限（GB），按 LRU 淘汰；s3 填 0 不限
  tagTTL: 5m                    # tag -> manifest 缓存有效期（digest 不受限）
  gcInterval: 10m               # 清理间隔
  manifestMaxAge: 720h          # manifest 缓存自然过期时间

  s3:                           # 仅 backend=s3 生效
    endpoint: ""                # 只填主机端口，如 minio.example.com:9000
    bucket: "docker-mirror-gateway"
    accessKey: ""
    secretKey: ""
    region: ""                  # MinIO 可留空
    prefix: "docker-mirror-gateway"   # 对象键前缀，清理任务只动此前缀
    useSSL: true
    pathStyle: false            # 自建 MinIO 通常 true
    tmpDir: ""                  # blob 上传暂存目录，留空用系统临时目录

# 谁能拉取镜像；只作用于拉取端口，管理端口由 adminToken 保护。留空不限制，deny 优先。
access:
  allow: []
  deny: []
  trustForwardedFor: false      # 仅反代后开启，否则客户端可伪造 X-Forwarded-For

# 控制台镜像搜索（查各仓库公开接口；GHCR/GCR 等无匿名搜索接口，不支持）
search:
  enabled: true
  sources: ["hub", "quay", "mcr"]
  timeout: 8s
  enrichUpdated: true           # 补查 Quay 更新时间
  enrichTags: true              # 补查最新版本号

health:
  interval: 1m                  # 探测间隔
  timeout: 10s                  # 单次探测超时
  failThreshold: 3              # 连续失败次数后标记不可用并降级
  # trafficWindow: 2m           # 窗口内有真实拉取的源跳过定时探测

selection:
  strategy: speed               # speed（实测吞吐）/ priority / latency
  speedProbeBytes: 262144       # 吞吐探测下载字节数
  speedProbeInterval: 30m       # 给久未被选中的源刷新吞吐
  speedTolerance: 0.25          # 吞吐差 25% 内算持平，再用延迟比较
  preferFresh: true             # latest 优先选构建时间更新的
  freshTags: ["latest"]         # 参与新旧比较的标签
  freshnessTolerance: 0s        # 构建时间差小于该值视为一样新
  freshnessTTL: 10m             # 新旧探测结果缓存时长

# 监控通知（默认关闭）：健康源数低于阈值时告警，恢复后通知。
# 模板变量：{{.Title}} {{.Text}} {{.TextJSON}} {{.State}} {{.StateText}}
#           {{.Group}} {{.Healthy}} {{.Total}} {{.Threshold}} {{.Failing}} {{.Time}}
notify:
  enabled: false
  interval: 30m                 # 持续异常重复提醒间隔
  # webhooks:                   # GET 只替换 url；POST 替换 url 与 body（留空发 JSON）
  #   - method: POST
  #     url: https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx
  #     body: '{"msg_type":"text","content":{"text":"{{.TextJSON}}"}}'
  #   - method: GET
  #     url: https://ops.example.com/hooks/mirror?group={{.Group}}&healthy={{.Healthy}}
  # email:
  #   enabled: true
  #   host: smtp.example.com
  #   port: 465                 # 465 隐式 TLS；587/25 尝试 STARTTLS
  #   username: user@example.com
  #   password: "******"
  #   from: user@example.com
  #   to: [me@example.com]

routing:
  autoDetect: true              # 无域名/路径线索时并发探测，自动判断仓库归属
  pathAliases: true             # 启用 /ghcr.io/owner/app 这类路径首段别名
  strategy: priority            # priority（数值小者胜）/ fastest
  defaultGroup: dockerhub       # 无法判定时的兜底分组
  detectTimeout: 5s             # 单次自动探测总超时
  routeTTL: 30m                 # 仓库 -> 分组判定缓存
  negativeTTL: 2m               # 仓库不存在的负缓存

# 每个分组对应一个公共仓库，组内多个加速源按 selection.strategy 自动选最快的。
# 预置源均为第三方免费服务，可能限速或下线，health 检查会自动降级。
groups:
  - name: dockerhub
    priority: 10                # 自动路由有歧义时数值小者胜
    default: true
    aliases: ["dockerhub", "docker.io", "registry-1.docker.io", "index.docker.io"]
    # hosts: ["docker.example.com"]   # 按请求域名路由到本分组（多域名部署用）
    hosts: ["docker.io", "registry-1.docker.io"]
    libraryNamespace: library   # 单段镜像名补全：nginx -> library/nginx
    probeRepo: library/alpine   # 健康探针须为真实存在的镜像
    probeTag: latest
    # notify:                   # 需全局 notify.enabled: true
    #   enabled: true
    #   minHealthy: 1
    upstreams:
      - name: dockerhub-sparkcr
        url: https://docker.sparkcr.cn
        priority: 10
      - name: dockerhub-1ms
        url: https://docker.1ms.run
        priority: 20
      - name: dockerhub-daocloud
        url: https://docker.m.daocloud.io
        priority: 30
      - name: dockerhub-1panel
        url: https://docker.1panel.live
        priority: 40
      - name: dockerhub
        url: https://registry-1.docker.io
        priority: 100
        # auth: passthrough     # 默认 config：用本源 username/password 认证；
                                # passthrough 把客户端凭证原样发给该源，仅完全信任的官方源开启
        # username: ""          # 填 Docker Hub 账号可提高配额（config 模式）
        # password: ""
        # proxy: "http://127.0.0.1:7890"         # 单源代理；也支持 socks5h://、direct
        # proxyUsername: "user"                  # 代理认证，也可写进 URL
        # proxyPassword: "${PROXY_PASSWORD}"

  - name: ghcr
    priority: 20
    aliases: ["ghcr", "ghcr.io"]
    hosts: ["ghcr.io"]
    probeRepo: stefanprodan/podinfo
    probeTag: latest
    upstreams:
      - name: ghcr-nju
        url: https://ghcr.nju.edu.cn
        priority: 10
      - name: ghcr-sparkcr
        url: https://ghcr.sparkcr.cn
        priority: 20
      - name: ghcr-dockerproxy
        url: https://ghcr.dockerproxy.net
        priority: 30
      - name: ghcr
        url: https://ghcr.io
        priority: 100

  - name: quay
    priority: 30
    aliases: ["quay", "quay.io"]
    hosts: ["quay.io"]
    probeRepo: prometheus/node-exporter
    probeTag: latest
    upstreams:
      - name: quay-nju
        url: https://quay.nju.edu.cn
        priority: 10
      - name: quay-sparkcr
        url: https://quay.sparkcr.cn
        priority: 20
      - name: quay-dockerproxy
        url: https://quay.dockerproxy.net
        priority: 30
      - name: quay-daocloud
        url: https://quay.m.daocloud.io
        priority: 40
      - name: quay
        url: https://quay.io
        priority: 100

  - name: mcr
    priority: 40
    aliases: ["mcr", "mcr.microsoft.com"]
    hosts: ["mcr.microsoft.com"]
    probeRepo: hello-world       # hello-world 层太小拿不到吞吐样本，此组通常按 priority 排
    probeTag: latest
    upstreams:
      - name: mcr-sparkcr
        url: https://mcr.sparkcr.cn
        priority: 10
      - name: mcr-dockerproxy
        url: https://mcr.dockerproxy.net
        priority: 20
      - name: mcr-daocloud
        url: https://mcr.m.daocloud.io
        priority: 30
      - name: mcr
        url: https://mcr.microsoft.com
        priority: 100

  - name: k8s
    priority: 50
    aliases: ["k8s", "registry.k8s.io", "k8s.gcr.io"]
    hosts: ["registry.k8s.io", "k8s.gcr.io"]
    probeRepo: pause
    probeTag: "3.9"
    upstreams:
      - name: k8s-nju
        url: https://k8s.nju.edu.cn
        priority: 10
      - name: k8s-sparkcr
        url: https://k8s.sparkcr.cn
        priority: 20
      - name: k8s-daocloud
        url: https://k8s.m.daocloud.io
        priority: 30
      - name: k8s-dockerproxy
        url: https://k8s.dockerproxy.net
        priority: 40
      - name: k8s
        url: https://registry.k8s.io
        priority: 100

  - name: gcr
    priority: 60
    aliases: ["gcr", "gcr.io", "marketplace.gcr.io"]
    hosts: ["gcr.io", "marketplace.gcr.io"]
    probeRepo: distroless/static
    probeTag: latest
    upstreams:
      - name: gcr-nju
        url: https://gcr.nju.edu.cn
        priority: 10
      - name: gcr-sparkcr
        url: https://gcr.sparkcr.cn
        priority: 20
      - name: gcr-daocloud
        url: https://gcr.m.daocloud.io
        priority: 30
      - name: gcr-dockerproxy
        url: https://gcr.dockerproxy.net
        priority: 40
      - name: gcr
        url: https://gcr.io
        priority: 100

  - name: elastic
    priority: 70
    aliases: ["elastic", "docker.elastic.co"]
    hosts: ["docker.elastic.co"]
    probeRepo: elasticsearch/elasticsearch
    probeTag: "8.15.0"
    upstreams:
      - name: elastic-sparkcr
        url: https://elastic.sparkcr.cn
        priority: 10
      - name: elastic-daocloud
        url: https://elastic.m.daocloud.io
        priority: 20
      - name: elastic
        url: https://docker.elastic.co
        priority: 100

  - name: nvcr
    priority: 80
    aliases: ["nvcr", "nvcr.io"]
    hosts: ["nvcr.io"]
    probeRepo: nvidia/cuda
    probeTag: "12.4.1-base-ubuntu22.04"
    upstreams:
      - name: nvcr-nju          # 南大 NGC 域名是 ngc.nju.edu.cn
        url: https://ngc.nju.edu.cn
        priority: 10
      - name: nvcr-sparkcr
        url: https://nvcr.sparkcr.cn
        priority: 20
      - name: nvcr-daocloud
        url: https://nvcr.m.daocloud.io
        priority: 30
      - name: nvcr
        url: https://nvcr.io
        priority: 100

log:
  level: info   # debug / info / warn / error
  format: text  # text / json
